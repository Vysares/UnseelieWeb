<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Unseelie Workshop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Tangerine is requested separately with display=block so a heading stays
         blank until it arrives. Nothing on the system resembles it, and the
         generic fallbacks are set far larger at the same font-size. -->
    <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@400;700&display=block" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/message.css">
</head>
<body>
    <div class="thankyou-wrap">
        <span class="thankyou-glyph">✦</span>
        <h1 class="thankyou-heading">Message Received</h1>
        <p class="thankyou-message">
            Thank you for reaching out. We'll be in touch soon.
        </p>
        <a href="contact.html" class="btn-primary">Go Back</a>
    </div>
    <script src="js/grain.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
