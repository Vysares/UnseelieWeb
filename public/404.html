<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Unseelie Workshop</title>
    <!-- Utility page: keep it out of search results, but let crawlers follow
         the link back into the site. -->
    <meta name="robots" content="noindex, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Tangerine is requested separately with display=block so a heading stays
         blank until it arrives. Nothing on the system resembles it, and the
         generic fallbacks are set far larger at the same font-size. -->
    <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@400;700&display=block" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="icon" href="favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wrap {
            text-align: center;
            padding: 4rem 2rem;
            animation: fadeInUp 0.9s ease-out both;
        }

        .four-oh-four {
            font-family: var(--font-display);
            font-size: clamp(7.5rem, 23vw, 15rem);
            font-weight: 700;
            color: var(--gold);
            line-height: 1;
            opacity: 0.18;
            letter-spacing: 0;
            display: block;
            margin-bottom: 2rem;
            user-select: none;
        }

        .tagline {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(var(--cream-rgb), 0.5);
            margin-bottom: 3rem;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <span class="four-oh-four" aria-hidden="true">404</span>
        <p class="tagline">This path leads nowhere.</p>
        <a href="index.html" class="btn-secondary">Take Me Home</a>
    </div>
</body>
</html>
